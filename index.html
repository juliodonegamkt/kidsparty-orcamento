<!doctype html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kids Party Orçamento</title>
<meta name="google" content="notranslate">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
  /* Layout: coluna única, uma pergunta por tela, azul royal da marca com faixa arco-íris e confete. */
  :root {
    color-scheme: light;
    --bg: #f3f6ff;
    --surface: #ffffff;
    --line: #dbe3fb;
    --fg: #14215a;
    --muted: #5b6894;
    --royal: #1f3fd1;
    --royal-dark: #142c9e;
    --sun: #ffc61a;
    --pink: #ff4f8b;
    --wa: #1faa59;
    --danger: #d92d4a;
    --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,198,26,.25) 0 60px, transparent 61px),
      radial-gradient(circle at 92% 18%, rgba(255,79,139,.16) 0 46px, transparent 47px),
      radial-gradient(circle at 85% 92%, rgba(31,63,209,.10) 0 80px, transparent 81px),
      var(--bg);
    color: var(--fg);
    font: 600 16px/1.5 var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 480px; margin: 0 auto; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 24px; min-height: 100vh; min-height: 100dvh; }
  header.brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 48px; height: 48px; border-radius: 50%; flex: none; background: conic-gradient(var(--pink), var(--sun), #33c26b, #2fa8ff, var(--royal), var(--pink)); padding: 3px; }
  .logo span { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: var(--royal); color: #fff; font: 800 13px/1 var(--font-display); text-align: center; letter-spacing: .02em; }
  .brand-name { font: 800 22px/1 var(--font-display); color: var(--royal); }
  .brand-sub { font: 700 12px/1.2 var(--font-body); color: var(--pink); letter-spacing: .12em; text-transform: uppercase; margin-top: 2px; }
  .rainbow { height: 6px; border-radius: 6px; background: linear-gradient(90deg, var(--pink), var(--sun), #33c26b, #2fa8ff, var(--royal)); }

  main { flex: 1; display: flex; flex-direction: column; }
  .screen { display: flex; flex-direction: column; gap: 20px; animation: in .28s ease both; }
  @keyframes in { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .screen { animation: none; } * { transition: none !important; } }

  .badge { align-self: flex-start; font: 800 12px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--fg); background: var(--sun); padding: 8px 12px; border-radius: 999px; }
  h1 { margin: 0; font: 800 clamp(40px, 11vw, 54px)/.98 var(--font-display); color: var(--royal); text-wrap: balance; }
  h1 em { font-style: normal; color: var(--pink); }
  .lead { margin: 0; color: var(--muted); font-size: 17px; max-width: 42ch; }
  .checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .checks li { display: flex; gap: 10px; align-items: center; }
  .checks i { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #e6ecff; font-style: normal; font-size: 14px; }

  .btn { appearance: none; border: 0; cursor: pointer; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font: 800 18px/1 var(--font-body); color: #fff; background: var(--royal); padding: 18px 20px; border-radius: var(--radius); box-shadow: 0 6px 0 var(--royal-dark); transition: transform .12s, box-shadow .12s; text-decoration: none; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--royal-dark); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.wa { background: var(--wa); box-shadow: 0 6px 0 #158a46; font-size: 19px; padding: 20px; }
  .btn:focus-visible, .opt:focus-visible, .ghost:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

  .progress { display: grid; gap: 8px; }
  .bar { height: 10px; background: #e3e9fb; border-radius: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--pink), var(--sun), #33c26b, #2fa8ff, var(--royal)); background-size: 480px 100%; transition: width .3s ease; }
  .step-label { font: 800 12px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--pink); }
  h2 { margin: 0; font: 800 clamp(28px, 8vw, 34px)/1.05 var(--font-display); color: var(--royal); text-wrap: balance; }
  .sub { margin: -10px 0 0; color: var(--muted); font-size: 15px; }

  .opts { display: grid; gap: 10px; }
  .opts.grid2 { grid-template-columns: 1fr 1fr; }
  .opt { appearance: none; cursor: pointer; text-align: left; width: 100%; display: flex; align-items: center; gap: 12px; font: 700 16px/1.25 var(--font-body); color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 15px 14px; transition: border-color .15s, background .15s; min-width: 0; }
  .opt .emo { flex: none; font-size: 22px; line-height: 1; }
  .opts.grid2 .opt:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .opt .grow { flex: 1; min-width: 0; }
  .opt .box { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 2px solid #b8c6f5; display: grid; place-items: center; }
  .opt[aria-pressed="true"] .box { background: var(--royal); border-color: var(--royal); }
  .opt[aria-pressed="true"] .box::after { content: ""; width: 9px; height: 5px; border: solid #fff; border-width: 0 0 2.5px 2.5px; transform: translateY(-1px) rotate(-45deg); }
  .hero-foto { margin: 0; border-radius: 22px; overflow: hidden; border: 4px solid var(--sun); box-shadow: 0 10px 0 -2px var(--royal); aspect-ratio: 16 / 12; max-width: 100%; background: #dfe6ff; }
  .hero-foto img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; display: block; }
  .opt:hover { border-color: #b8c6f5; }
  .opt[aria-pressed="true"] { border-color: var(--royal); background: #eaf0ff; }

  .fields { display: grid; gap: 14px; }
  label.f { display: grid; gap: 7px; font: 800 14px/1.2 var(--font-body); }
  input { width: 100%; font: 600 16px/1.4 var(--font-body); color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 14px; min-height: 52px; }
  input::placeholder { color: #9aa5c7; }
  input[aria-invalid="true"] { border-color: var(--danger); }
  .err { color: var(--danger); font: 700 13px/1.3 var(--font-body); min-height: 1em; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .note { color: var(--muted); font-size: 13px; text-align: center; margin: 0; }
  .link-btn { appearance: none; background: none; border: 2px dashed var(--line); border-radius: 14px; padding: 13px; cursor: pointer; font: 700 15px/1.2 var(--font-body); color: var(--muted); }
  .link-btn[aria-pressed="true"] { border-style: solid; border-color: var(--royal); color: var(--royal); background: #eaf0ff; }

  .nav { display: flex; gap: 10px; margin-top: auto; padding-top: 8px; }
  .ghost { appearance: none; cursor: pointer; background: var(--surface); color: var(--muted); border: 2px solid var(--line); border-radius: 14px; padding: 13px 16px; font: 700 15px/1 var(--font-body); }
  .nav .btn { flex: 1; padding: 14px; font-size: 16px; }

  .done-icon { width: 68px; height: 68px; border-radius: 50%; background: var(--sun); display: grid; place-items: center; font-size: 32px; }
  .summary { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 4px 16px; margin: 0; display: grid; }
  .summary div { display: grid; grid-template-columns: 100px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .summary div:last-child { border-bottom: 0; }
  .summary dt { color: var(--muted); }
  .summary dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .center { display: flex; justify-content: center; }
</style>
</head>
<body>

<div class="wrap">
  <header class="brand">
    <div class="logo" aria-hidden="true"><span>KIDS<br>PARTY</span></div>
    <div>
      <div class="brand-name">Kids Party</div>
      <div class="brand-sub">Recreação</div>
    </div>
  </header>
  <div class="rainbow" aria-hidden="true"></div>
  <main id="app" aria-live="polite"></main>
</div>

<script>
/* ================== CONFIGURAÇÃO ================== */
const CONFIG = {
  WHATSAPP: '5511914078950',  // WhatsApp da Kids Party (55 + DDD + número)
  WEBHOOK_URL: '',            // opcional: entrada de leads do CRM
  PIXEL_ID: ''                // opcional: ID do Pixel da Meta
};
/* ================================================== */

const STEPS = [
  { id: 'evento', type: 'single', title: 'Qual é a ocasião do evento?', grid: true,
    options: [['🎂', 'Aniversário infantil'], ['🏫', 'Festa na escola'], ['🏢', 'Condomínio'], ['💍', 'Casamento'], ['💼', 'Corporativo'], ['🏨', 'Hotel / Resort'], ['✨', 'Outra ocasião']] },
  { id: 'criancas', type: 'single', title: 'Quantas crianças, mais ou menos?',
    options: [['👧', 'Até 15'], ['👫', '16 a 30'], ['🧒', '31 a 60'], ['🎉', 'Mais de 60']] },
  { id: 'servicos', type: 'multi', title: 'O que não pode faltar?', sub: 'Pode marcar mais de um.',
    options: [['🤸', 'Recreação e gincanas'], ['🎨', 'Pintura facial e balões'], ['🧪', 'Oficinas (slime, tie-dye…)'], ['🎁', 'Pacote completo']] },
  { id: 'data', type: 'data', title: 'Qual a data do evento?', sub: 'Assim já vemos se a data está livre na agenda.' },
  { id: 'local', type: 'local', title: 'Onde vai ser o evento?' },
  { id: 'contato', type: 'contato', title: 'Pra quem enviamos o orçamento?' }
];

const state = { step: -1, a: {}, enviado: false };
const app = document.getElementById('app');
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DIAS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];

function hojeISO() {
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}
function textoData(a) {
  if (a.semData || !a.data) return 'Ainda sem data definida';
  const [y, m, d] = a.data.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return `${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${y} (${DIAS[dt.getDay()]})`;
}
function diasAte(a) {
  if (a.semData || !a.data) return null;
  const [y, m, d] = a.data.split('-').map(Number);
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  return Math.round((new Date(y, m - 1, d) - hoje) / 86400000);
}
function classificar(a) {
  const n = diasAte(a);
  if (n === null) return 'Frio';
  if (n <= 45) return 'Quente';
  if (n <= 120) return 'Morno';
  return 'Frio';
}
function mascaraTel(v) {
  const d = v.replace(/\D/g, '').slice(0, 11);
  if (d.length <= 2) return d.length ? '(' + d : '';
  if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`;
  if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
}
function utms() {
  const p = new URLSearchParams(location.search); const o = {};
  ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'fbclid'].forEach(k => { if (p.get(k)) o[k] = p.get(k); });
  return o;
}

/* Mensagem que o cliente envia no WhatsApp (sem a classificação interna) */
function mensagem(a) {
  return [
    'Olá! Vim pelo site e quero um orçamento da Kids Party 🎉',
    '',
    `*Nome:* ${a.nome}`,
    `*Evento:* ${a.evento}`,
    `*Quero:* ${(a.servicos || []).join(', ')}`,
    `*Data:* ${textoData(a)}`,
    `*Crianças:* ${a.criancas}`,
    `*Local:* ${a.local}`
  ].join('\n');
}
function linkWhats(a) { return `https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(mensagem(a))}`; }

function enviarLead(a) {
  if (state.enviado) return; state.enviado = true;
  const payload = { data_envio: new Date().toISOString(), classificacao: classificar(a), nome: a.nome,
    whatsapp: a.whatsapp.replace(/\D/g, ''), evento: a.evento, data_evento: a.semData ? '' : a.data,
    criancas: a.criancas, servicos: (a.servicos || []).join(', '), local: a.local, pagina: location.origin + location.pathname, ...utms() };
  if (CONFIG.WEBHOOK_URL) {
    try { fetch(CONFIG.WEBHOOK_URL, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }).catch(() => {}); } catch (e) {}
  }
  try { if (window.fbq) fbq('track', 'Lead', { content_name: 'Orçamento Kids Party', status: payload.classificacao }); } catch (e) {}
}
if (CONFIG.PIXEL_ID) {
  !function (f, b, e, v, n, t, s) { if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments) }; if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = []; t = b.createElement(e); t.async = !0; t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s) }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', CONFIG.PIXEL_ID); fbq('track', 'PageView');
}

const ICON_WA = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.79-1.47-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.6-.92-2.2-.24-.58-.49-.5-.67-.5h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.3 1.27.49 1.7.63.71.23 1.36.2 1.88.12.57-.09 1.75-.72 2-1.41.25-.69.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35zM12.05 21.8h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.82 9.82 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.88 9.88zm8.41-18.3A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.17-3.48-8.41z"/></svg>';

function render() {
  if (state.step === -1) return renderHero();
  if (state.step >= STEPS.length) return renderFim();
  const s = STEPS[state.step], a = state.a, total = STEPS.length;
  const pct = Math.round((state.step / total) * 100);
  let corpo = '', continuar = false;

  if (s.type === 'multi') {
    continuar = true;
    const sel = a[s.id] || [];
    corpo = `<div class="opts">` + s.options.map(([e, o]) =>
      `<button class="opt multi" type="button" data-v="${esc(o)}" aria-pressed="${sel.includes(o)}"><span class="emo" aria-hidden="true">${e}</span><span class="grow">${esc(o)}</span><span class="box" aria-hidden="true"></span></button>`).join('') + '</div><div class="err" id="err"></div>';
  } else if (s.type === 'single') {
    corpo = `<div class="opts ${s.grid ? 'grid2' : ''}">` + s.options.map(([e, o]) =>
      `<button class="opt" type="button" data-v="${esc(o)}" aria-pressed="${a[s.id] === o}"><span class="emo" aria-hidden="true">${e}</span>${esc(o)}</button>`).join('') + '</div>';
  } else if (s.type === 'data') {
    continuar = true;
    corpo = `<div class="fields">
      <label class="f" for="data">Data do evento<input id="data" type="date" min="${hojeISO()}" value="${esc(a.semData ? '' : (a.data || ''))}"></label>
      <button class="link-btn" type="button" id="semData" aria-pressed="${!!a.semData}">Ainda não tenho data definida</button>
      <div class="err" id="err"></div></div>`;
  } else if (s.type === 'local') {
    continuar = true;
    corpo = `<div class="fields">
      <label class="f" for="local">Cidade e bairro<input id="local" autocomplete="address-level2" placeholder="Ex: Santo André, Vila Assunção" value="${esc(a.local || '')}"></label>
      <div class="err" id="err"></div></div>`;
  } else if (s.type === 'contato') {
    continuar = true;
    corpo = `<form id="form" class="fields" novalidate>
      <label class="f" for="nome">Seu nome<input id="nome" autocomplete="given-name" placeholder="Nome" value="${esc(a.nome || '')}"></label>
      <label class="f" for="whatsapp">Seu WhatsApp (com DDD)<input id="whatsapp" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="(11) 90000-0000" value="${esc(a.whatsapp || '')}"></label>
      <div class="hp" aria-hidden="true"><label for="empresa">Empresa</label><input id="empresa" tabindex="-1" autocomplete="off"></div>
      <div class="err" id="err"></div>
      <p class="note">Usamos seus dados só para enviar o orçamento.</p></form>`;
  }

  app.innerHTML = `<section class="screen">
    <div class="progress"><span class="step-label">Etapa ${state.step + 1} de ${total}</span>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${Math.max(pct, 8)}%"></i></div></div>
    <h2>${esc(s.title)}</h2>
    ${s.sub ? `<p class="sub">${esc(s.sub)}</p>` : ''}
    ${corpo}
    <div class="nav">
      <button class="ghost" type="button" id="voltar">← Voltar</button>
      ${continuar ? `<button class="btn" type="button" id="continuar">${s.type === 'contato' ? 'Ver meu orçamento' : 'Continuar'} →</button>` : ''}
    </div></section>`;

  app.querySelectorAll('.opt.multi').forEach(b => b.onclick = () => {
    const v = b.dataset.v; const sel = a[s.id] || [];
    a[s.id] = sel.includes(v) ? sel.filter(x => x !== v) : [...sel, v];
    b.setAttribute('aria-pressed', a[s.id].includes(v));
    document.getElementById('err').textContent = '';
  });
  app.querySelectorAll('.opt:not(.multi)').forEach(b => b.onclick = () => {
    a[s.id] = b.dataset.v;
    app.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', x === b));
    setTimeout(() => { state.step++; render(); }, 220);
  });
  document.getElementById('voltar').onclick = () => { state.step--; render(); };
  const c = document.getElementById('continuar'); if (c) c.onclick = () => avancar(s);

  if (s.type === 'data') {
    const inp = document.getElementById('data'), sem = document.getElementById('semData');
    inp.oninput = () => { a.data = inp.value; a.semData = false; sem.setAttribute('aria-pressed', 'false'); inp.removeAttribute('aria-invalid'); };
    sem.onclick = () => { a.semData = !a.semData; sem.setAttribute('aria-pressed', a.semData); if (a.semData) { inp.value = ''; a.data = ''; } };
  }
  if (s.type === 'local') { const l = document.getElementById('local'); l.oninput = () => { a.local = l.value; l.removeAttribute('aria-invalid'); }; }
  if (s.type === 'contato') {
    const tel = document.getElementById('whatsapp');
    tel.oninput = () => { tel.value = mascaraTel(tel.value); tel.removeAttribute('aria-invalid'); };
    document.getElementById('nome').oninput = e => e.target.removeAttribute('aria-invalid');
    document.getElementById('form').onsubmit = e => { e.preventDefault(); avancar(s); };
  }
  window.scrollTo({ top: 0 });
}

function avancar(s) {
  const a = state.a, err = document.getElementById('err');
  if (s.type === 'multi' && !(a[s.id] || []).length) { err.textContent = 'Marque pelo menos uma opção.'; return; }
  if (s.type === 'data') {
    if (!a.semData && !a.data) { document.getElementById('data').setAttribute('aria-invalid', 'true'); err.textContent = 'Escolha a data ou marque que ainda não tem data definida.'; return; }
    if (!a.semData && a.data < hojeISO()) { err.textContent = 'Essa data já passou. Escolha uma data a partir de hoje.'; return; }
  }
  if (s.type === 'local') {
    a.local = document.getElementById('local').value.trim();
    if (a.local.length < 3) { document.getElementById('local').setAttribute('aria-invalid', 'true'); err.textContent = 'Informe a cidade e o bairro do evento.'; return; }
  }
  if (s.type === 'contato') {
    const nome = document.getElementById('nome'), tel = document.getElementById('whatsapp');
    const dig = tel.value.replace(/\D/g, ''), falta = [];
    if (nome.value.trim().length < 2) { nome.setAttribute('aria-invalid', 'true'); falta.push('seu nome'); }
    if (dig.length < 10 || dig.length > 11) { tel.setAttribute('aria-invalid', 'true'); falta.push('um WhatsApp com DDD'); }
    if (falta.length) { err.textContent = 'Preencha ' + falta.join(' e ') + '.'; return; }
    a.nome = nome.value.trim(); a.whatsapp = tel.value;
    if (!document.getElementById('empresa').value) enviarLead(a);
  }
  state.step++; render();
}

function renderHero() {
  app.innerHTML = `<section class="screen">
    <figure class="hero-foto"><img src="equipe.jpg" alt="Equipe de recreadores da Kids Party com uniforme azul" width="771" height="726"></figure>
    <span class="badge">Orçamento grátis</span>
    <h1>Onde tem criança, a Kids Party <em>leva diversão!</em></h1>
    <p class="lead">Recreação para aniversários, escolas, condomínios, empresas e casamentos. Responda 5 perguntinhas e receba seu orçamento no WhatsApp.</p>
    <ul class="checks">
      <li><i aria-hidden="true">🎈</i> Recreadores animados e experientes</li>
      <li><i aria-hidden="true">🎨</i> Oficinas de slime, pintura facial, balões e muito mais</li>
      <li><i aria-hidden="true">⭐</i> Mais de 450 eventos animados, atendimento humano e sem compromisso</li>
    </ul>
    <button class="btn" type="button" id="comecar">Quero meu orçamento →</button>
  </section>`;
  document.getElementById('comecar').onclick = () => { state.step = 0; render(); };
}

function renderFim() {
  const a = state.a, primeiro = (a.nome || '').split(' ')[0];
  const linhas = [['Evento', a.evento], ['Quero', (a.servicos || []).join(', ')], ['Data', textoData(a)], ['Crianças', a.criancas], ['Local', a.local]];
  app.innerHTML = `<section class="screen">
    <div class="done-icon" aria-hidden="true">👇</div>
    <h2>Quase lá, ${esc(primeiro)}!</h2>
    <p class="sub" style="margin:0">Último passo: toque no botão abaixo pra enviar seu pedido no WhatsApp. Suas respostas já vão prontas na mensagem.</p>
    <a class="btn wa" id="wa" href="${linkWhats(a)}" target="_blank" rel="noopener">${ICON_WA} Receber orçamento no WhatsApp</a>
    <dl class="summary">${linhas.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
    <div class="center"><button class="ghost" type="button" id="refazer">← Corrigir respostas</button></div>
  </section>`;
  document.getElementById('wa').onclick = () => { try { if (window.fbq) fbq('track', 'Contact'); } catch (e) {} };
  document.getElementById('refazer').onclick = () => { state.step = 0; render(); };
  window.scrollTo({ top: 0 });
}

render();
</script>
</body>
</html>
